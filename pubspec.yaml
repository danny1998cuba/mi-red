name: mi_red
description: App Android offline para la administración de una red local.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  drift: 2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  path_provider: ^2.1.6
  sqlite3: 3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
