name: mi_red
description: App Android offline para administrar una red local, desarrollada por CoreX4Dev.
homepage: https://corex4dev.com
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  drift: 2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_file_dialog: 3.3.3
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: 22.3.3
  flutter_timezone: 5.1.1
  forui: 0.27.7
  go_router: ^18.1.1
  path_provider: ^2.1.6
  package_info_plus: 10.2.2
  shared_preferences: 2.5.6
  sqlite3: 3.8.0
  share_plus: 13.3.1
  timezone: 0.11.2
  url_launcher: 6.3.3

dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
  - assets/branding/mi_red_logo_master.png
